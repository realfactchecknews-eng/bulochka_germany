<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Книги — Булочка учит Deutsch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    .books-page { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
    .books-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .books-nav a { color: var(--pink-500); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

    /* ── BOOK LIST ── */
    .books-hero { text-align: center; padding: 0 20px 22px; }
    .books-hero h1 { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: var(--pink-500); margin-bottom: 6px; }
    .books-hero p { color: var(--text-muted); font-size: 0.92rem; }

    .book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media(max-width:560px){ .book-grid { grid-template-columns: 1fr; } }

    .book-card {
      background: var(--white); border: 2px solid var(--cream);
      border-radius: 20px; padding: 24px 20px; cursor: pointer;
      transition: all 0.18s; text-align: center;
      box-shadow: 0 4px 16px rgba(224,57,127,0.07);
    }
    .book-card:hover { border-color: var(--pink-300); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(224,57,127,0.14); }
    .book-cover { font-size: 3.5rem; margin-bottom: 10px; }
    .book-level { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; background: linear-gradient(135deg, var(--pink-400), var(--pink-500)); color: #fff; padding: 2px 10px; border-radius: 20px; margin-bottom: 8px; }
    .book-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text-dark); margin-bottom: 4px; }
    .book-author { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
    .book-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
    .book-progress { margin-top: 10px; height: 4px; background: var(--cream); border-radius: 4px; overflow: hidden; }
    .book-progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink-400), var(--pink-500)); border-radius: 4px; transition: width 0.4s; }
    .book-progress-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

    /* ── READER ── */
    .reader { display: none; }
    .reader.active { display: block; }

    .reader-header {
      background: linear-gradient(135deg, #fff0f7, #fce8f3);
      border: 1.5px solid var(--cream); border-radius: 20px;
      padding: 16px 20px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .reader-back { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--pink-500); padding: 4px; }
    .reader-info { flex: 1; }
    .reader-book-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text-dark); }
    .reader-chapter { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .reader-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .reader-nav-btn {
      padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--cream);
      background: var(--white); font-size: 0.82rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .reader-nav-btn:hover { border-color: var(--pink-300); color: var(--pink-500); }
    .reader-nav-btn.active { background: linear-gradient(135deg, var(--pink-400), var(--pink-500)); color: #fff; border-color: transparent; }
    .reader-nav-btn:disabled { opacity: 0.4; cursor: default; }

    .reader-chapter-select {
      padding: 7px 12px; border-radius: 12px; border: 1.5px solid var(--cream);
      font-size: 0.82rem; color: var(--text-dark); background: var(--white);
      cursor: pointer; flex: 1; max-width: 300px;
    }

    .reader-body {
      background: var(--white); border: 1.5px solid var(--cream);
      border-radius: 20px; padding: 28px 32px;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; line-height: 1.9; color: var(--text-dark);
      box-shadow: 0 4px 20px rgba(224,57,127,0.06);
      white-space: pre-wrap;
    }
    @media(max-width:560px){ .reader-body { padding: 18px 16px; font-size: 0.97rem; } }

    .reader-body .word {
      cursor: pointer; border-radius: 3px;
      transition: background 0.12s;
      display: inline;
    }
    .reader-body .word:hover { background: #ffd6e7; }
    .reader-body .word.looked-up { background: #fff0b3; }

    .reader-hint { text-align: center; font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; }

    /* ── TRANSLATION TOOLTIP ── */
    .tooltip {
      position: fixed; z-index: 1000;
      background: #fff; border: 2px solid var(--pink-300);
      border-radius: 14px; padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(224,57,127,0.18);
      max-width: 260px; min-width: 140px;
      display: none;
    }
    .tooltip.visible { display: block; }
    .tooltip-word { font-weight: 800; font-size: 1rem; color: var(--text-dark); margin-bottom: 4px; }
    .tooltip-trans { font-size: 0.88rem; color: var(--pink-500); font-weight: 600; margin-bottom: 8px; }
    .tooltip-loading { font-size: 0.82rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .tooltip-close { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    .tooltip-add-btn {
      display: block; width: 100%; padding: 8px; background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: white; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; margin-top: 8px;
    }
    .tooltip-add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(224,57,127,0.3); }
    .tooltip-add-btn:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>

  <header class="header">
    <div class="container">
      <div class="logo"><span class="logo-heart">❤️</span><span id="user-name">Булочка</span> учит Deutsch</div>
      <div class="header-right">
        <div class="xp-badge">⚡ <span id="total-xp">0</span> XP</div>
        <div class="streak-badge">🔥 <span id="streak">0</span> дней</div>
        <button class="logout-btn" id="logout-btn" title="Выйти">↩</button>
      </div>
    </div>
  </header>

  <div class="sync-bar" id="sync-bar"><span id="sync-status">☁️</span></div>

  <div class="books-page">
    <div class="books-nav"><a href="index.html">← На главную</a></div>

    <!-- BOOK LIST -->
    <div id="book-list">
      <div class="books-hero">
        <h1>📚 Библиотека</h1>
        <p>Читай немецкие книги — нажми на любое слово и получи перевод 💕</p>
      </div>
      <div class="book-grid" id="book-grid"></div>
    </div>

    <!-- READER -->
    <div class="reader" id="reader">
      <div class="reader-header">
        <button class="reader-back" onclick="showBookList()">←</button>
        <div class="reader-info">
          <div class="reader-book-title" id="reader-title"></div>
          <div class="reader-chapter" id="reader-chapter-label"></div>
        </div>
      </div>
      <div class="reader-nav">
        <button class="reader-nav-btn" id="btn-prev" onclick="changeChapter(-1)">← Назад</button>
        <select class="reader-chapter-select" id="chapter-select" onchange="goToChapter(this.value)"></select>
        <button class="reader-nav-btn" id="btn-next" onclick="changeChapter(1)">Вперёд →</button>
      </div>
      <div class="reader-body" id="reader-body"></div>
      <div class="reader-hint">💡 Нажми на любое слово чтобы узнать перевод</div>
    </div>
  </div>

  <!-- TOOLTIP -->
  <div class="tooltip" id="tooltip">
    <button class="tooltip-close" onclick="closeTooltip()">✕</button>
    <div class="tooltip-word" id="tt-word"></div>
    <div class="tooltip-trans" id="tt-trans"></div>
    <button class="tooltip-add-btn" id="tt-add-btn" style="display:none;" onclick="addCurrentWordToAnki()">➕ В Anki</button>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/books-data.js"></script>
  <script type="module" src="./js/chat-widget.js"></script>

  <script type="module">
    import { initAuth, logout } from './js/sync.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    const _app = initializeApp(FIREBASE_CONFIG, 'books');
    const _db  = getFirestore(_app);

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('Выйти?')) logout();
    });

    initAuth(async () => {
      document.getElementById('total-xp').textContent = localStorage.getItem('bulochka-xp') || '0';
      document.getElementById('streak').textContent   = localStorage.getItem('bulochka-streak') || '0';
      const name = localStorage.getItem('bulochka-login') || 'Булочка';
      document.getElementById('user-name').textContent = name.charAt(0).toUpperCase() + name.slice(1);
      try {
        const snap = await getDoc(doc(_db, 'config', 'openrouter'));
        if (snap.exists()) window._orKey = snap.data().key;
      } catch(e) {}
      renderBookList();
    });
  </script>

  <script>
    const PROGRESS_KEY = 'bulochka-books-progress';
    let currentBook = null;
    let currentChapter = 0;
    const transCache = {};

    function getProgress() { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); }
    function saveProgress(bookId, chapterIdx) {
      const p = getProgress();
      if (!p[bookId]) p[bookId] = { chapter: 0, maxChapter: 0 };
      p[bookId].chapter = chapterIdx;
      p[bookId].maxChapter = Math.max(p[bookId].maxChapter || 0, chapterIdx);
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
    }

    function renderBookList() {
      const grid = document.getElementById('book-grid');
      const progress = getProgress();
      grid.innerHTML = Object.values(BOOKS_DATA).map(book => {
        const p = progress[book.id];
        const pct = p ? Math.round(((p.maxChapter + 1) / book.chapters.length) * 100) : 0;
        const label = p ? `Глава ${p.maxChapter + 1} из ${book.chapters.length}` : 'Не начата';
        return `
          <div class="book-card" onclick="openBook('${book.id}')">
            <div class="book-cover">${book.cover}</div>
            <div class="book-level">${book.level}</div>
            <div class="book-title">${book.title}</div>
            <div class="book-author">${book.author}</div>
            <div class="book-desc">${book.desc}</div>
            <div class="book-progress"><div class="book-progress-fill" style="width:${pct}%"></div></div>
            <div class="book-progress-label">${label}</div>
          </div>`;
      }).join('');
    }

    function openBook(bookId) {
      currentBook = BOOKS_DATA[bookId];
      const progress = getProgress();
      currentChapter = progress[bookId]?.chapter || 0;

      document.getElementById('book-list').style.display = 'none';
      document.getElementById('reader').classList.add('active');
      document.getElementById('reader-title').textContent = currentBook.title;

      const select = document.getElementById('chapter-select');
      select.innerHTML = currentBook.chapters.map((ch, i) =>
        `<option value="${i}">${i + 1}. ${ch.title}</option>`
      ).join('');

      renderChapter();
    }

    function showBookList() {
      document.getElementById('book-list').style.display = '';
      document.getElementById('reader').classList.remove('active');
      renderBookList();
    }

    function renderChapter() {
      const ch = currentBook.chapters[currentChapter];
      document.getElementById('chapter-select').value = currentChapter;
      document.getElementById('reader-chapter-label').textContent = ch.title;
      document.getElementById('btn-prev').disabled = currentChapter === 0;
      document.getElementById('btn-next').disabled = currentChapter === currentBook.chapters.length - 1;

      // Wrap each word in a span
      const text = ch.text;
      const html = text.replace(/([а-яёА-ЯЁa-zA-ZäöüÄÖÜß]+)/g, (word) => {
        const cls = transCache[word.toLowerCase()] ? 'word looked-up' : 'word';
        return `<span class="${cls}" data-word="${word}">${word}</span>`;
      });
      document.getElementById('reader-body').innerHTML = html;

      // Attach click handlers
      document.querySelectorAll('#reader-body .word').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          translateWord(el.dataset.word, el);
        });
      });

      saveProgress(currentBook.id, currentChapter);
    }

    function changeChapter(dir) {
      currentChapter = Math.max(0, Math.min(currentBook.chapters.length - 1, currentChapter + dir));
      renderChapter();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToChapter(idx) {
      currentChapter = parseInt(idx);
      renderChapter();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.goToChapter = goToChapter;
    window.changeChapter = changeChapter;
    window.openBook = openBook;
    window.showBookList = showBookList;

    // ── TRANSLATION ──────────────────────────────────────────────────────────
    async function translateWord(word, el) {
      const tooltip = document.getElementById('tooltip');
      const ttWord  = document.getElementById('tt-word');
      const ttTrans = document.getElementById('tt-trans');
      const ttAddBtn = document.getElementById('tt-add-btn');

      // Position near clicked word
      const rect = el.getBoundingClientRect();
      tooltip.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
      tooltip.style.top  = (rect.bottom + window.scrollY + 8) + 'px';
      ttWord.textContent  = word;
      ttTrans.innerHTML   = '<span class="tooltip-loading"><span class="spinner" style="width:13px;height:13px;border-width:2px"></span> Перевожу...</span>';
      ttAddBtn.style.display = 'none';
      tooltip.classList.add('visible');

      // Сохраняем текущее слово для кнопки добавления
      window._currentWord = word;

      const lower = word.toLowerCase();
      if (transCache[lower]) {
        ttTrans.textContent = transCache[lower];
        window._currentTrans = transCache[lower];
        ttAddBtn.style.display = 'block';
        markLookedUp(lower);
        return;
      }

      const key = window._orKey;
      if (!key) { ttTrans.textContent = '⚠️ ИИ недоступен'; return; }

      try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.origin, 'X-Title': 'Bulochka Deutsch' },
          body: JSON.stringify({
            model: 'openai/gpt-4o-mini',
            messages: [{ role: 'user', content: `Переведи немецкое слово "${word}" на русский. Дай только перевод (1–4 слова), без пояснений. Если слово не немецкое — напиши "—".` }],
            max_tokens: 30, temperature: 0,
          }),
        });
        const data = await res.json();
        const trans = data.choices?.[0]?.message?.content?.trim() || '—';
        transCache[lower] = trans;
        ttTrans.textContent = trans;
        window._currentTrans = trans;
        ttAddBtn.style.display = trans !== '—' ? 'block' : 'none';
        markLookedUp(lower);
      } catch(e) {
        ttTrans.textContent = 'Ошибка перевода';
        ttAddBtn.style.display = 'none';
      }
    }

    function markLookedUp(lower) {
      document.querySelectorAll(`#reader-body .word[data-word]`).forEach(el => {
        if (el.dataset.word.toLowerCase() === lower) el.classList.add('looked-up');
      });
    }

    function closeTooltip() { document.getElementById('tooltip').classList.remove('visible'); }
    window.closeTooltip = closeTooltip;

    function addCurrentWordToAnki() {
      const de = window._currentWord;
      const ru = window._currentTrans;
      if (!de || !ru) return;

      // Проверяем есть ли функция из anki.html
      if (typeof window.addWordToAnki === 'function') {
        window.addWordToAnki(de, ru, '');
      } else {
        // Fallback: добавляем напрямую в localStorage
        const words = JSON.parse(localStorage.getItem('bulochka-custom-words') || '[]');
        if (!words.some(w => w.de === de)) {
          words.push({ de, ru, ex: '' });
          localStorage.setItem('bulochka-custom-words', JSON.stringify(words));
        }
        alert(`✅ "${de}" добавлено в "Мои слова"`);
      }
      closeTooltip();
    }
    window.addCurrentWordToAnki = addCurrentWordToAnki;

    document.addEventListener('click', () => closeTooltip());

    // floating hearts
    const fhC = document.getElementById('floating-hearts');
    ['❤️','🩷','💕','📚','✨'].forEach(ch => {
      const el = document.createElement('div'); el.className = 'fh'; el.textContent = ch;
      el.style.cssText = `left:${Math.random()*100}%;bottom:-10%;font-size:${0.9+Math.random()}rem;animation-delay:${Math.random()*20}s;animation-duration:${22+Math.random()*14}s;`;
      fhC.appendChild(el);
    });
  </script>
</body>
</html>
