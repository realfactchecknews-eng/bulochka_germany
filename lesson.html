<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Урок — Булочка учит Deutsch</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">🥐 <span>Булочка</span> учит Deutsch</div>
      <div class="header-right">
        <div class="xp-badge">⚡ <span id="total-xp">0</span> XP</div>
        <div class="streak-badge">🔥 <span id="streak">0</span> дней</div>
      </div>
    </div>
  </header>

  <div id="lesson-root"></div>

  <!-- Complete modal -->
  <div class="modal-overlay" id="complete-modal">
    <div class="modal-card">
      <div class="modal-emoji">🎉</div>
      <h2>Урок пройден!</h2>
      <p>Отличная работа, Булочка! Ты молодец 💕</p>
      <div class="modal-xp" id="modal-xp">+0 XP</div>
      <button class="modal-btn" onclick="window.location.href='index.html'">На главную</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/lessons-content.js"></script>
  <script src="js/lesson.js"></script>
</body>
</html>
