<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Письменные задания — Булочка учит Deutsch</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    .writing-page { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }

    .writing-hero { text-align: center; padding: 36px 20px 28px; }
    .writing-hero h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--pink-500); margin-bottom: 8px; }
    .writing-hero p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; }

    .task-cards { display: flex; flex-direction: column; gap: 28px; }

    .task-card {
      background: var(--white);
      border-radius: 20px;
      border: 1.5px solid var(--cream);
      box-shadow: 0 4px 18px rgba(224,57,127,0.07);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .task-card:hover { box-shadow: 0 8px 28px rgba(224,57,127,0.13); }

    .task-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--cream);
    }
    .task-level {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      background: linear-gradient(135deg, #ffd6e7, #ffadd1);
      color: var(--pink-500);
      padding: 3px 10px; border-radius: 20px;
      white-space: nowrap;
    }
    .task-title { font-weight: 700; font-size: 1.05rem; color: var(--text-dark); }

    .task-body { padding: 18px 22px 22px; }

    .task-prompt {
      background: linear-gradient(135deg, #fff0f7, #fce8f3);
      border-left: 3px solid var(--pink-400);
      border-radius: 0 12px 12px 0;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.93rem;
      color: var(--text-dark);
      line-height: 1.6;
    }
    .task-hint { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px; }
    .task-hint strong { color: var(--pink-500); }

    .writing-area {
      width: 100%;
      min-height: 130px;
      border: 2px solid var(--cream);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      background: var(--white);
    }
    .writing-area:focus { border-color: var(--pink-400); box-shadow: 0 0 0 3px rgba(255,173,209,0.25); }
    .writing-area::placeholder { color: #d4a0b8; }

    .check-writing-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .check-writing-btn:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .check-writing-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .ai-result { margin-top: 18px; border-radius: 16px; overflow: hidden; display: none; }
    .ai-result.visible { display: block; }

    .ai-result-header {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .ai-result-body {
      background: #fff8fc;
      border: 1.5px solid #ffd6e7;
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 16px 18px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text-dark);
      white-space: pre-wrap;
    }
    .ai-loading {
      display: flex; align-items: center; gap: 10px;
      color: var(--pink-500); font-size: 0.9rem;
      padding: 14px 18px;
      background: #fff8fc;
      border: 1.5px solid #ffd6e7;
      border-radius: 0 0 16px 16px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #ffd6e7;
      border-top-color: var(--pink-500);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .score-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.8rem; font-weight: 700;
      background: rgba(255,255,255,0.25);
      color: #fff;
      padding: 3px 12px; border-radius: 20px;
      margin-left: auto;
    }

    .writing-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .writing-nav a { color: var(--pink-500); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .writing-nav a:hover { text-decoration: underline; }

    .section-label {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-muted); text-transform: uppercase;
      margin: 32px 0 14px;
    }

    /* ── HISTORY ── */
    .history-section { margin-top: 60px; }
    .history-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--pink-500);
      margin-bottom: 6px;
    }
    .history-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

    .history-empty {
      text-align: center; color: var(--text-muted);
      font-size: 0.9rem; padding: 32px;
      background: var(--white);
      border: 1.5px dashed var(--cream);
      border-radius: 16px;
    }

    .history-list { display: flex; flex-direction: column; gap: 16px; }

    .history-item {
      background: var(--white);
      border: 1.5px solid var(--cream);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(224,57,127,0.05);
    }
    .history-item-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .history-item-header:hover { background: #fff5f9; }
    .history-item-level {
      font-size: 0.7rem; font-weight: 700;
      background: linear-gradient(135deg, #ffd6e7, #ffadd1);
      color: var(--pink-500);
      padding: 2px 8px; border-radius: 20px;
      white-space: nowrap;
    }
    .history-item-title { font-weight: 700; font-size: 0.92rem; color: var(--text-dark); flex: 1; }
    .history-item-date { font-size: 0.78rem; color: var(--text-muted); }
    .history-item-score {
      font-size: 0.8rem; font-weight: 700;
      background: linear-gradient(135deg, #ffd6e7, #ffadd1);
      color: var(--pink-500);
      padding: 2px 10px; border-radius: 20px;
    }
    .history-item-toggle { color: var(--text-muted); font-size: 0.8rem; margin-left: 4px; transition: transform 0.2s; }
    .history-item.open .history-item-toggle { transform: rotate(180deg); }

    .history-item-body { display: none; border-top: 1px solid var(--cream); }
    .history-item.open .history-item-body { display: block; }

    .history-text-block {
      padding: 12px 18px;
      background: linear-gradient(135deg, #fff0f7, #fce8f3);
      border-bottom: 1px solid var(--cream);
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap;
    }
    .history-text-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      color: var(--pink-500); text-transform: uppercase;
      margin-bottom: 6px;
    }
    .history-ai-block {
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text-dark);
      white-space: pre-wrap;
    }

    .history-clear-btn {
      margin-top: 16px;
      background: none;
      border: 1.5px solid var(--cream);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
    }
    .history-clear-btn:hover { border-color: var(--pink-300); color: var(--pink-500); }
  </style>
</head>

        <button class="history-clear-btn" onclick="clearHistory()">🗑 Очистить историю</button>
      `;

    function toggleHistory(i) {

Тон: профессиональный и тёплый. Не хвали за то, что сделано неправильно. Будь честна в оценке, но поддерживай.`;

      try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${OPENROUTER_KEY}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Bulochka Deutsch',
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: `Задание: "${task.title}"\n\nТекст Марго:\n${text}` }
            ],
            max_tokens: 1200,
            temperature: 0.4,
          }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'Нет ответа от ИИ';

        const scoreMatch = reply.match(/ОЦЕНКА:\s*(\d+)\s*\/\s*10/);
        const score = scoreMatch ? scoreMatch[1] : null;
        if (score) scoreEl.textContent = `${score}/10`;

        bodyEl.style.padding = '';
        bodyEl.textContent = reply;
        resultEl.querySelector('.ai-result-header').style.display = 'flex';

        // Сохраняем в историю
        const now = new Date();
        const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        saveToHistory({
          taskId,
          level: task.level,
          title: task.title,
          text,
          reply,
          score,
          date: dateStr,
          ts: now.getTime(),
        });

      } catch (e) {
        bodyEl.style.padding = '';
        bodyEl.textContent = `Ошибка при обращении к ИИ: ${e.message}\n\nПопробуй позже.`;
        resultEl.querySelector('.ai-result-header').style.display = 'flex';
      }

      btn.disabled = false;
      btn.innerHTML = '<span>🤖</span> Проверить снова';
    }

    // Init
    renderTasks();
    renderHistory();

    const fhC = document.getElementById('floating-hearts');
    ['❤️','🩷','💕','💗','🌸'].forEach(ch => {
      const el = document.createElement('div');
      el.className = 'fh';
      el.textContent = ch;
      el.style.cssText = `left:${Math.random()*100}%;bottom:-10%;font-size:${0.9+Math.random()}rem;animation-delay:${Math.random()*20}s;animation-duration:${22+Math.random()*14}s;`;
      fhC.appendChild(el);
    });
  </script>
</body>
</html>
