<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Грамматика — Булочка учит Deutsch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { background: var(--milk); }

    .gr-layout {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      gap: 24px;
      align-items: flex-start;
    }

    /* ── SIDEBAR ── */
    .gr-sidebar {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 80px;
      background: var(--white);
      border: 1.5px solid var(--cream);
      border-radius: 18px;
      overflow: hidden;
    }
    .gr-sidebar-title {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff;
      padding: 14px 16px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
    }
    .gr-nav { padding: 8px 0; max-height: calc(100vh - 180px); overflow-y: auto; }
    .gr-nav::-webkit-scrollbar { width: 3px; }
    .gr-nav::-webkit-scrollbar-thumb { background: var(--cream); border-radius: 3px; }

    .gr-nav-section {
      padding: 6px 14px 2px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .gr-nav-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--text-dark);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      line-height: 1.3;
    }
    .gr-nav-item:hover { background: var(--pink-50); color: var(--pink-500); border-left-color: var(--pink-200); }
    .gr-nav-item.active { background: #fff0f7; color: var(--pink-500); border-left-color: var(--pink-400); font-weight: 700; }
    .gr-nav-item .nav-num {
      font-size: 0.65rem; font-weight: 700;
      background: var(--cream); color: var(--text-muted);
      padding: 1px 5px; border-radius: 6px; flex-shrink: 0;
    }
    .gr-nav-item.active .nav-num { background: var(--pink-100); color: var(--pink-500); }

    /* ── CONTENT ── */
    .gr-content { flex: 1; min-width: 0; }

    .gr-hero {
      background: linear-gradient(135deg, var(--white), #fff0f7);
      border: 1.5px solid var(--cream);
      border-radius: 20px;
      padding: 22px 26px 18px;
      margin-bottom: 20px;
    }
    .gr-hero h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--pink-500); margin-bottom: 5px; }
    .gr-hero p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }

    .gr-topic { display: none; }
    .gr-topic.active { display: block; }

    /* ── TOPIC CARD ── */
    .gr-card {
      background: var(--white);
      border: 1.5px solid var(--cream);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .gr-card-header {
      background: linear-gradient(135deg, #fff0f7, #fce8f3);
      padding: 14px 20px;
      border-bottom: 1px solid var(--cream);
      display: flex; align-items: center; gap: 10px;
    }
    .gr-card-kap {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: #fff; padding: 2px 9px; border-radius: 20px; white-space: nowrap;
    }
    .gr-card-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.05rem; color: var(--text-dark); }
    .gr-card-body { padding: 18px 20px; }

    .gr-card-body p { font-size: 0.9rem; line-height: 1.7; color: var(--text-dark); margin-bottom: 12px; }
    .gr-card-body ul { margin: 0 0 12px 18px; }
    .gr-card-body li { font-size: 0.9rem; line-height: 1.8; color: var(--text-dark); }
    .gr-card-body b { color: var(--pink-600, #c0306a); }

    .table-wrap { overflow-x: auto; margin-bottom: 14px; }
    .table-wrap table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
    .table-wrap th {
      background: linear-gradient(135deg, #ffd6e7, #ffadd1);
      color: var(--pink-600, #b03070); padding: 8px 12px;
      text-align: left; font-weight: 700; font-size: 0.78rem;
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .table-wrap td { padding: 7px 12px; border-bottom: 1px solid #fce8f3; color: var(--text-dark); vertical-align: top; }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tr:hover td { background: #fffafc; }

    .example-box {
      background: linear-gradient(135deg, #fff8fc, #fce8f3);
      border-left: 3px solid var(--pink-400);
      border-radius: 0 10px 10px 0;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .example-box .de { font-weight: 600; font-size: 0.9rem; color: var(--text-dark); margin-bottom: 3px; }
    .example-box .ru { font-size: 0.83rem; color: var(--text-muted); }

    .tip-box {
      background: linear-gradient(135deg, #f0f7ff, #e8f0ff);
      border-left: 3px solid #7bb8f5;
      border-radius: 0 10px 10px 0;
      padding: 10px 14px; margin-bottom: 12px;
      font-size: 0.86rem; color: #2d5a8e; line-height: 1.6;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .vocab-item {
      background: #fff8fc;
      border: 1.5px solid var(--cream);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .vocab-item .v-de { font-weight: 700; color: var(--text-dark); }
    .vocab-item .v-ru { color: var(--text-muted); font-size: 0.8rem; }
    .vocab-item .v-art { color: var(--pink-500); font-size: 0.75rem; font-weight: 600; }

    .section-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 18px 0 10px; padding-bottom: 6px;
      border-bottom: 1.5px solid var(--cream);
    }

    @media (max-width: 700px) {
      .gr-layout { flex-direction: column; }
      .gr-sidebar { width: 100%; position: static; }
      .gr-nav { max-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>

  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-heart">❤️</span>
        <span id="user-name">Булочка</span> учит Deutsch
      </div>
      <div class="header-right">
        <div class="xp-badge">⚡ <span id="total-xp">0</span> XP</div>
        <div class="streak-badge">🔥 <span id="streak">0</span> дней</div>
        <button class="logout-btn" id="logout-btn" title="Выйти">↩</button>
      </div>
    </div>
  </header>

  <div class="gr-layout">
    <!-- SIDEBAR -->
    <nav class="gr-sidebar">
      <div class="gr-sidebar-title">📚 Грамматика · Die Gelbe</div>
      <div class="gr-nav" id="gr-nav"></div>
    </nav>

    <!-- CONTENT -->
    <div class="gr-content">
      <div class="gr-hero">
        <div class="writing-nav" style="margin-bottom:10px"><a href="index.html">← На главную</a></div>
        <h1>📖 Справочник по грамматике</h1>
        <p>Вся теория из учебника «Dreyer/Schmitt — Lehr- und Übungsbuch der deutschen Grammatik» (Die Gelbe). Выбери тему слева — читай, запоминай, возвращайся когда нужно 💕</p>
      </div>
      <div id="gr-topics"></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module" src="./js/chat-widget.js"></script>
  <script type="module">
    import { initAuth, logout } from './js/sync.js';
    document.getElementById('logout-btn').addEventListener('click', () => { if (confirm('Выйти?')) logout(); });
    initAuth(() => {
      document.getElementById('total-xp').textContent = localStorage.getItem('bulochka-xp') || '0';
      document.getElementById('streak').textContent = localStorage.getItem('bulochka-streak') || '0';
      const n = localStorage.getItem('bulochka-login') || 'Булочка';
      document.getElementById('user-name').textContent = n.charAt(0).toUpperCase() + n.slice(1);
    });
  </script>

  <script>
  // ═══════════════════════════════════════════════════════════════
  // ДАННЫЕ СПРАВОЧНИКА
  // ═══════════════════════════════════════════════════════════════
  const TOPICS = [
    {
      section: 'A1 — Основы',
      id: 'sein-haben',
      nav: 'sein, haben, heißen',
      kap: 'Kapitel 1',
      title: 'Глаголы sein, haben, heißen',
      content: `
        <div class="section-label">sein — быть</div>
        <div class="table-wrap"><table>
          <tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr>
          <tr><td>ich</td><td><b>bin</b></td><td>Ich bin Studentin.</td></tr>
          <tr><td>du</td><td><b>bist</b></td><td>Du bist nett.</td></tr>
          <tr><td>er / sie / es</td><td><b>ist</b></td><td>Er ist Arzt.</td></tr>
          <tr><td>wir</td><td><b>sind</b></td><td>Wir sind aus Russland.</td></tr>
          <tr><td>ihr</td><td><b>seid</b></td><td>Ihr seid müde.</td></tr>
          <tr><td>sie / Sie</td><td><b>sind</b></td><td>Sie sind Studenten.</td></tr>
        </table></div>

        <div class="section-label">haben — иметь</div>
        <div class="table-wrap"><table>
          <tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr>
          <tr><td>ich</td><td><b>habe</b></td><td>Ich habe eine Katze.</td></tr>
          <tr><td>du</td><td><b>hast</b></td><td>Du hast ein Auto.</td></tr>
          <tr><td>er / sie / es</td><td><b>hat</b></td><td>Sie hat Hunger.</td></tr>
          <tr><td>wir</td><td><b>haben</b></td><td>Wir haben Zeit.</td></tr>
          <tr><td>ihr</td><td><b>habt</b></td><td>Ihr habt Recht.</td></tr>
          <tr><td>sie / Sie</td><td><b>haben</b></td><td>Sie haben viel Arbeit.</td></tr>
        </table></div>

        <div class="section-label">heißen — называться / звать</div>
        <div class="example-box">
          <div class="de">Ich <b>heiße</b> Margo. — Меня зовут Марго.</div>
          <div class="ru">Wie <b>heißt</b> du? — Как тебя зовут?</div>
        </div>
        <div class="example-box">
          <div class="de">Die Stadt <b>heißt</b> Wien. — Город называется Вена.</div>
        </div>

        <div class="section-label">Устойчивые выражения с haben</div>
        <div class="table-wrap"><table>
          <tr><th>Немецкий</th><th>Русский</th></tr>
          <tr><td>Hunger haben</td><td>быть голодным</td></tr>
          <tr><td>Durst haben</td><td>хотеть пить</td></tr>
          <tr><td>Angst haben</td><td>бояться</td></tr>
          <tr><td>Zeit haben</td><td>иметь время</td></tr>
          <tr><td>Recht haben</td><td>быть правым</td></tr>
          <tr><td>Lust haben</td><td>хотеть / иметь желание</td></tr>
        </table></div>
      `,
    },
    {
      section: 'A1 — Основы',
      id: 'artikel',
      nav: 'Артикли der/die/das',
      kap: 'Kapitel 2–3',
      title: 'Артикли и роды существительных',
      content: `
        <div class="section-label">Три рода в немецком</div>
        <div class="table-wrap"><table>
          <tr><th>Род</th><th>Определённый</th><th>Неопределённый</th><th>Отрицание</th><th>Пример</th></tr>
          <tr><td>мужской (m)</td><td><b>der</b></td><td><b>ein</b></td><td><b>kein</b></td><td>der Tisch, ein Mann</td></tr>
          <tr><td>женский (f)</td><td><b>die</b></td><td><b>eine</b></td><td><b>keine</b></td><td>die Frau, eine Stadt</td></tr>
          <tr><td>средний (n)</td><td><b>das</b></td><td><b>ein</b></td><td><b>kein</b></td><td>das Kind, ein Buch</td></tr>
          <tr><td>мн. число</td><td><b>die</b></td><td>—</td><td><b>keine</b></td><td>die Bücher</td></tr>
        </table></div>

        <div class="section-label">Подсказки для определения рода</div>
        <div class="table-wrap"><table>
          <tr><th>Мужской (der)</th><th>Женский (die)</th><th>Средний (das)</th></tr>
          <tr><td>-er: der Lehrer</td><td>-ung: die Wohnung</td><td>-chen: das Mädchen</td></tr>
          <tr><td>-ig: der König</td><td>-heit: die Freiheit</td><td>-lein: das Fräulein</td></tr>
          <tr><td>-ling: der Frühling</td><td>-keit: die Möglichkeit</td><td>-ment: das Moment</td></tr>
          <tr><td>-or: der Motor</td><td>-schaft: die Freundschaft</td><td>-tum: das Studium</td></tr>
          <tr><td>-ismus: der Tourismus</td><td>-ion: die Station</td><td>Ge-: das Gebäude</td></tr>
          <tr><td>Дни, месяцы, сезоны</td><td>-ei: die Bäckerei</td><td>Уменьшительные</td></tr>
        </table></div>

        <div class="section-label">Множественное число — 5 типов</div>
        <div class="table-wrap"><table>
          <tr><th>Тип</th><th>Правило</th><th>Примеры</th></tr>
          <tr><td>1</td><td>без изменений / умлаут</td><td>der Lehrer → die Lehrer; der Vater → die Väter</td></tr>
          <tr><td>2</td><td>+ <b>-e</b> / умлаут + -e</td><td>der Tag → die Tage; der Baum → die Bäume</td></tr>
          <tr><td>3</td><td>+ <b>-er</b> / умлаут + -er</td><td>das Kind → die Kinder; das Buch → die Bücher</td></tr>
          <tr><td>4</td><td>+ <b>-(e)n</b></td><td>die Frau → die Frauen; die Stadt → die Städte (n)</td></tr>
          <tr><td>5</td><td>+ <b>-s</b> (иностранные)</td><td>das Auto → die Autos; das Hotel → die Hotels</td></tr>
        </table></div>
        <div class="tip-box">💡 Учи слово сразу с артиклем и формой множественного числа: <b>der Mann / die Männer</b></div>
      `,
    },
    {
      section: 'A1 — Основы',
      id: 'kasus-nom-akk',
      nav: 'Nominativ и Akkusativ',
      kap: 'Kapitel 4',
      title: 'Падежи: Nominativ и Akkusativ',
      content: `
        <div class="section-label">Система падежей</div>
        <div class="table-wrap"><table>
          <tr><th>Падеж</th><th>Вопрос</th><th>Роль</th></tr>
          <tr><td><b>Nominativ</b></td><td>Wer? Was?</td><td>Подлежащее (кто/что делает)</td></tr>
          <tr><td><b>Akkusativ</b></td><td>Wen? Was?</td><td>Прямое дополнение (кого/что)</td></tr>
          <tr><td>Dativ</td><td>Wem?</td><td>Косвенное дополнение (кому)</td></tr>
          <tr><td>Genitiv</td><td>Wessen?</td><td>Принадлежность (чей)</td></tr>
        </table></div>

        <div class="section-label">Артикли в Nominativ и Akkusativ</div>
        <div class="table-wrap"><table>
          <tr><th>Род</th><th>Nom. (def.)</th><th>Akk. (def.)</th><th>Nom. (indef.)</th><th>Akk. (indef.)</th></tr>
          <tr><td><b>m</b></td><td>der</td><td><b>den</b></td><td>ein</td><td><b>einen</b></td></tr>
          <tr><td><b>f</b></td><td>die</td><td>die</td><td>eine</td><td>eine</td></tr>
          <tr><td><b>n</b></td><td>das</td><td>das</td><td>ein</td><td>ein</td></tr>
          <tr><td><b>pl</b></td><td>die</td><td>die</td><td>—</td><td>—</td></tr>
        </table></div>
        <div class="tip-box">⭐ Меняется только мужской род! der → den, ein → einen. Всё остальное без изменений.</div>

        <div class="example-box">
          <div class="de"><b>Der</b> Mann kauft <b>den</b> Apfel. — Мужчина покупает яблоко.</div>
          <div class="ru"><b>Die</b> Frau liest <b>ein</b> Buch. — Женщина читает книгу.</div>
        </div>

        <div class="section-label">Отрицание: nicht vs. kein</div>
        <div class="table-wrap"><table>
          <tr><th>nicht</th><th>kein / keine</th></tr>
          <tr><td>Перед глаголами, прилагательными, наречиями</td><td>Перед существительными (=«не + артикль»)</td></tr>
          <tr><td>Ich komme <b>nicht</b>.</td><td>Ich habe <b>kein</b> Geld.</td></tr>
          <tr><td>Das ist <b>nicht</b> gut.</td><td>Es gibt <b>keine</b> Zeit.</td></tr>
        </table></div>
      `,
    },
    {
      section: 'A1 — Основы',
      id: 'praesens',
      nav: 'Präsens: глаголы',
      kap: 'Kapitel 5–7',
      title: 'Глаголы в настоящем времени (Präsens)',
      content: `
        <div class="section-label">Стандартное спряжение</div>
        <div class="table-wrap"><table>
          <tr><th>Лицо</th><th>Окончание</th><th>lernen</th><th>wohnen</th><th>arbeiten*</th></tr>
          <tr><td>ich</td><td>-e</td><td>lern<b>e</b></td><td>wohn<b>e</b></td><td>arbeit<b>e</b></td></tr>
          <tr><td>du</td><td>-st</td><td>lern<b>st</b></td><td>wohn<b>st</b></td><td>arbeit<b>est</b></td></tr>
          <tr><td>er/sie/es</td><td>-t</td><td>lern<b>t</b></td><td>wohn<b>t</b></td><td>arbeit<b>et</b></td></tr>
          <tr><td>wir</td><td>-en</td><td>lern<b>en</b></td><td>wohn<b>en</b></td><td>arbeit<b>en</b></td></tr>
          <tr><td>ihr</td><td>-t</td><td>lern<b>t</b></td><td>wohn<b>t</b></td><td>arbeit<b>et</b></td></tr>
          <tr><td>sie/Sie</td><td>-en</td><td>lern<b>en</b></td><td>wohn<b>en</b></td><td>arbeit<b>en</b></td></tr>
        </table></div>
        <p>* Основа на -t/-d: добавляем -<b>e</b> для произносимости: arbeit<b>e</b>st, öffn<b>e</b>st</p>

        <div class="section-label">Сильные глаголы (e→i, a→ä) — du и er/sie/es</div>
        <div class="table-wrap"><table>
          <tr><th>Инфинитив</th><th>du</th><th>er/sie/es</th><th>Перевод</th></tr>
          <tr><td>sprechen</td><td>spr<b>i</b>chst</td><td>spr<b>i</b>cht</td><td>говорить</td></tr>
          <tr><td>lesen</td><td>l<b>ie</b>st</td><td>l<b>ie</b>st</td><td>читать</td></tr>
          <tr><td>essen</td><td><b>i</b>sst</td><td><b>i</b>sst</td><td>есть</td></tr>
          <tr><td>nehmen</td><td>n<b>i</b>mmst</td><td>n<b>i</b>mmt</td><td>брать</td></tr>
          <tr><td>fahren</td><td>f<b>ä</b>hrst</td><td>f<b>ä</b>hrt</td><td>ехать</td></tr>
          <tr><td>schlafen</td><td>schl<b>ä</b>fst</td><td>schl<b>ä</b>ft</td><td>спать</td></tr>
          <tr><td>laufen</td><td>l<b>äu</b>fst</td><td>l<b>äu</b>ft</td><td>бегать/идти</td></tr>
        </table></div>

        <div class="section-label">Модальные глаголы</div>
        <div class="table-wrap"><table>
          <tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>möchten</th></tr>
          <tr><td>ich/er</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>möchte</td></tr>

  function render() {
    const nav = document.getElementById('gr-nav');
    const content = document.getElementById('gr-topics');
    let currentSection = '';
    let navHtml = '';
    let contentHtml = '';

    TOPICS.forEach((t, i) => {
      if (t.section !== currentSection) {
        currentSection = t.section;
        navHtml += `<div class="gr-nav-section">${t.section}</div>`;
      }
      navHtml += `
        <div class="gr-nav-item ${i===0?'active':''}" id="nav-${t.id}" onclick="showTopic('${t.id}')">
          <span class="nav-num">${t.kap.replace('Kapitel ','').replace('Лексика ','')}</span>
          ${t.nav}
        </div>`;

      contentHtml += `
        <div class="gr-topic ${i===0?'active':''}" id="topic-${t.id}">
          <div class="gr-card">
            <div class="gr-card-header">
              <span class="gr-card-kap">${t.kap}</span>
              <span class="gr-card-title">${t.title}</span>
            </div>
            <div class="gr-card-body">${t.content}</div>
          </div>
        </div>`;
    });

    nav.innerHTML = navHtml;
    content.innerHTML = contentHtml;
  }

  function showTopic(id) {
    document.querySelectorAll('.gr-topic').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.gr-nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`topic-${id}`)?.classList.add('active');
    document.getElementById(`nav-${id}`)?.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.showTopic = showTopic;

  render();

  const fhC = document.getElementById('floating-hearts');
  ['❤️','🩷','💕','🌸'].forEach(ch => {
    const el = document.createElement('div');

    el.style.cssText = `left:${Math.random()*100}%;bottom:-10%;font-size:${0.9+Math.random()}rem;animation-delay:${Math.random()*20}s;animation-duration:${22+Math.random()*14}s;`;
    fhC.appendChild(el);
  });
