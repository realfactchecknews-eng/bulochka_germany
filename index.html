<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Булочка учит Deutsch 🥐</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">🥐 <span>Булочка</span> учит Deutsch</div>
      <div class="header-right">
        <div class="xp-badge">⚡ <span id="total-xp">0</span> XP</div>
        <div class="streak-badge">🔥 <span id="streak">0</span> дней</div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <!-- Hero -->
      <section class="hero">
        <div class="hero-text">
          <h1>Привет, Булочка! 👋</h1>
          <p>Твой персональный курс немецкого. От A1 до B1 — шаг за шагом.<br>
          Каждый день немного — и ты уже в Австрии 🇦🇹</p>
        </div>
        <div class="hero-progress">
          <div class="level-card">
            <div class="level-label">Текущий уровень</div>
            <div class="level-badge">A1</div>
            <div class="level-goal">Цель: B1 для поступления</div>
          </div>
          <div class="overall-progress">
            <div class="progress-label">Общий прогресс</div>
            <div class="progress-bar-wrap">
              <div class="progress-bar" id="overall-bar" style="width:0%"></div>
            </div>
            <div class="progress-pct" id="overall-pct">0%</div>
          </div>
        </div>
      </section>

      <!-- Path -->
      <section class="path">
        <h2>Путь обучения</h2>
        <div class="modules" id="modules-container"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      Сделано с ❤️ Матвеем специально для Булочки
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
