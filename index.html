<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Булочка учит Deutsch</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ❤️ HEART SPLASH -->
  <div id="heart-splash">
    <div class="heart-wrap">
      <div class="heart-petals" id="petals"></div>
      <svg class="heart-svg" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffadd1"/>
            <stop offset="100%" style="stop-color:#e0397f"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path fill="url(#hg)" filter="url(#glow)"
          d="M100 170 C100 170 20 120 20 65 C20 35 42 15 65 15
             C80 15 92 23 100 35 C108 23 120 15 135 15
             C158 15 180 35 180 65 C180 120 100 170 100 170Z"/>
      </svg>
      <div class="heart-text">
        <span class="line1">for Bulochka</span>
        <span class="line2">with Love ❤️</span>
      </div>
    </div>
  </div>

  <div class="floating-hearts" id="floating-hearts"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-heart">❤️</span>
        <span id="user-name">Булочка</span> учит Deutsch
      </div>
      <div class="header-right">
        <div class="xp-badge">⚡ <span id="total-xp">0</span> XP</div>
        <div class="streak-badge">🔥 <span id="streak">0</span> дней</div>
        <button class="logout-btn" id="logout-btn" title="Выйти">↩</button>
      </div>
    </div>
  </header>

  <!-- Статус синхронизации -->
  <div class="sync-bar" id="sync-bar">
    <span id="sync-status">☁️ Синхронизация...</span>
  </div>

  <main class="main">
    <div class="container">
      <section class="hero">
        <div class="hero-text">
          <h1>Привет, <em id="hero-name">Булочка!</em> ❤️</h1>
          <p>Твой персональный курс немецкого — от A1 до B1.<br>
          Каждый день немного — и ты уже в Австрии 🇦🇹✨</p>
        </div>
        <div class="hero-cards">
          <div class="hero-card">
            <div class="label">Уровень</div>
            <div class="level-big">A1</div>
            <div class="goal-text">Цель: B1 🎓</div>
          </div>
          <div class="hero-card">
            <div class="label">Прогресс</div>
            <div class="prog-bar-wrap">
              <div class="prog-bar" id="overall-bar"></div>
            </div>
            <div class="prog-pct" id="overall-pct">0%</div>
          </div>
        </div>
      </section>

      <section class="path">
        <div class="section-title">🌸 Путь обучения</div>
        <div id="modules-container"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      Сделано с <span>❤️</span> Матвеем специально для Булочки
    </div>
  </footer>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <script type="module">
    import { initAuth, logout } from './js/sync.js';

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('Выйти из аккаунта?')) logout();
    });

    initAuth(() => {
      // Данные подтянуты из облака — рендерим
      renderStats();
      renderOverall();
      renderModules();
      showSync('✅ Синхронизировано');
    });

    function showSync(msg) {
      const bar = document.getElementById('sync-bar');
      const st  = document.getElementById('sync-status');
      st.textContent = msg;
      bar.classList.add('visible');
      setTimeout(() => bar.classList.remove('visible'), 2500);
    }

    // Экспортируем showSync для использования из lesson.js
    window.showSync = showSync;
  </script>

  <script>
    function spawnPetals() {
      const container = document.getElementById('petals');
      const colors = ['#ffadd1','#ffc8df','#ff80b9','#ffb3d1','#ffd6e7','#ff99c8'];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const angle = (i / 24) * 360;
        const dist  = 160 + Math.random() * 100;
        p.style.cssText = `
          background:${colors[i%colors.length]};
          left:calc(50% - 5px);top:calc(50% - 5px);
          --tx:${Math.cos(angle*Math.PI/180)*dist}px;
          --ty:${Math.sin(angle*Math.PI/180)*dist}px;
          --rot:${Math.random()*360}deg;
          animation-delay:${0.6+i*0.025}s;
          animation-duration:${1.2+Math.random()*0.6}s;
          width:${5+Math.random()*10}px;height:${5+Math.random()*10}px;
        `;
        container.appendChild(p);
      }
    }
    spawnPetals();
    setTimeout(() => {
      const s = document.getElementById('heart-splash');
      s.classList.add('fade-out');
      setTimeout(() => s.remove(), 900);
    }, 2800);

    const fhC = document.getElementById('floating-hearts');
    ['❤️','🩷','💕','💗','💓','🌸','✨','💝','💖','🩷'].forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'fh';
      el.textContent = ch;
      el.style.cssText = `left:${Math.random()*100}%;bottom:-10%;font-size:${0.8+Math.random()*1.4}rem;animation-delay:${Math.random()*20}s;animation-duration:${20+Math.random()*16}s;`;
      fhC.appendChild(el);
    });
  </script>
</body>
</html>
