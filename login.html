<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Булочка учит Deutsch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="floating-hearts" id="floating-hearts"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-hearts">❤️</div>
      <h1 class="login-title">Булочка учит<br><em>Deutsch</em></h1>
      <p class="login-sub">Войди чтобы прогресс сохранялся на всех устройствах</p>

      <div class="login-form">
        <div class="field-wrap">
          <label class="field-label">Логин</label>
          <input class="field-input" id="login-input" type="text" placeholder="Bulochka" autocomplete="username" />
        </div>
        <div class="field-wrap">
          <label class="field-label">Пароль</label>
          <input class="field-input" id="pass-input" type="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="eye-btn" id="eye-btn" onclick="togglePass()" type="button">👁</button>
        </div>
        <div class="login-error" id="login-error"></div>
        <button class="login-btn" id="login-btn" onclick="doLogin()">Войти ❤️</button>
        <p class="login-toggle" id="login-toggle" style="text-align:center;margin-top:14px;font-size:0.85rem;color:var(--text-muted);">
          Нет аккаунта? <a href="#" id="toggle-mode" onclick="toggleMode(event)" style="color:var(--pink-500);font-weight:600;">Создать</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Сначала грузим конфиг, потом Firebase -->
  <script src="js/firebase-config.js"></script>

  <script type="module">
    import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
                                                    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    // Уже залогинена — сразу на главную
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'index.html';
    });

    let registerMode = false;

    // email выводится из логина: известные — через USER_MAP, новые — login@домен
    function emailFor(login) {
      return USER_MAP[login] || `${login}@bulochka-deutsch.de`;
    }

    window.toggleMode = function(e) {
      if (e) e.preventDefault();
      registerMode = !registerMode;
      const btn = document.getElementById('login-btn');
      const toggle = document.getElementById('login-toggle');
      document.getElementById('login-error').textContent = '';
      if (registerMode) {
        btn.textContent = 'Создать аккаунт';
        toggle.innerHTML = 'Уже есть аккаунт? <a href="#" onclick="toggleMode(event)" style="color:var(--pink-500);font-weight:600;">Войти</a>';
      } else {
        btn.textContent = 'Войти ❤️';
        toggle.innerHTML = 'Нет аккаунта? <a href="#" onclick="toggleMode(event)" style="color:var(--pink-500);font-weight:600;">Создать</a>';
      }
    };

    window.doLogin = async function() {
      const loginVal = document.getElementById('login-input').value.trim().toLowerCase();
      const passVal  = document.getElementById('pass-input').value;
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('login-btn');

      errEl.textContent = '';

      if (!loginVal || !passVal) {
        errEl.textContent = 'Введи логин и пароль!';
        return;
      }
      if (!/^[a-z0-9_]+$/.test(loginVal)) {
        errEl.textContent = 'Логин: только латиница, цифры и _ 🙏';
        return;
      }
      if (registerMode && passVal.length < 6) {
        errEl.textContent = 'Пароль минимум 6 символов 🙈';
        return;
      }

      const email = emailFor(loginVal);
      btn.textContent = registerMode ? 'Создаём...' : 'Входим...';
      btn.disabled = true;

      try {
        if (registerMode) {
          await createUserWithEmailAndPassword(auth, email, passVal);
        } else {
          await signInWithEmailAndPassword(auth, email, passVal);
        }
        localStorage.setItem('bulochka-login', loginVal);
        window.location.href = 'index.html';
      } catch (e) {
        console.error(e);
        const map = {
          'auth/wrong-password':       'Неверный пароль 🙈',
          'auth/invalid-credential':   'Неверный логин или пароль 🙈',
          'auth/user-not-found':       'Такого аккаунта нет — создай новый 🙂',
          'auth/email-already-in-use': 'Такой логин уже занят 🤔',
          'auth/weak-password':        'Пароль слишком простой (мин. 6) 🙈',
        };
        errEl.textContent = map[e.code] || ('Ошибка: ' + e.message);
        btn.textContent = registerMode ? 'Создать аккаунт' : 'Войти ❤️';
        btn.disabled = false;
      }
    };

    window.togglePass = function() {
      const inp = document.getElementById('pass-input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    };
  </script>

  <script>
    const fh = document.getElementById('floating-hearts');
    ['❤️','🩷','💕','💗','💓','🌸'].forEach((ch) => {
      const el = document.createElement('div');
      el.className = 'fh';
      el.textContent = ch;
      el.style.cssText = `left:${Math.random()*100}%;bottom:-10%;font-size:${0.9+Math.random()*1.2}rem;animation-delay:${Math.random()*18}s;animation-duration:${18+Math.random()*12}s;`;
      fh.appendChild(el);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin && window.doLogin(); });
  </script>
</body>
</html>
